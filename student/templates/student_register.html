<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Registration</title>

<link rel="stylesheet" href="{{ url_for('student.static', filename='css/registration.css') }}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- WebAuthn Browser JS -->
<script src="https://cdn.jsdelivr.net/npm/@simplewebauthn/browser@9.0.1/dist/bundle.min.js"></script>
</head>
<body>

<div class="registration-container">
    <div class="registration-box">

        <div class="logo-header-vertical">
            <img src="{{ url_for('student.static', filename='image/school_logo.png') }}" alt="School Logo" class="logo">
            <div class="university-name">
                Cebu Technological University Moalboal Campus
            </div>
        </div>

        <h2>Register as a Student</h2>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form id="registrationForm" method="POST">

            <!-- First Name -->
            <div class="input-group floating">
                <input type="text" id="first_name" name="first_name" required placeholder=" ">
                <label for="first_name">First Name</label>
            </div>

            <!-- Middle Name -->
            <div class="input-group floating">
                <input type="text" id="middle_name" name="middle_name" placeholder=" ">
                <label for="middle_name">Middle Name</label>
            </div>

            <!-- Last Name -->
            <div class="input-group floating">
                <input type="text" id="last_name" name="last_name" required placeholder=" ">
                <label for="last_name">Last Name</label>
            </div>

            <!-- Suffix -->
            <div class="input-group floating">
                <input type="text" id="suffix" name="suffix" placeholder=" ">
                <label for="suffix">Suffix</label>
            </div>

            <!-- Department / Course (NO FLOATING) -->
            <div class="input-group">
                <label for="course">Department / Course</label>
                <select id="course" name="course" required>
                    <option value="">-- Select Course --</option>
                    {% for dept_name, courses in courses_by_department.items() %}
                        <optgroup label="{{ dept_name }}">
                            {% for course in courses %}
                                <option value="{{ course.id }}"
                                    {% if session.registration_data and session.registration_data.course_id == course.id %}
                                        selected
                                    {% endif %}>
                                    {{ course.course_name }}
                                </option>
                            {% endfor %}
                        </optgroup>
                    {% endfor %}
                </select>
            </div>

            <!-- Birth Date (NO FLOATING) -->
            <div class="input-group">
                <label for="birth_date">Birth Date</label>
                <input type="date" id="birth_date" name="birth_date" required>
            </div>

            <!-- Email -->
            <div class="input-group floating">
                <input type="email" id="email" name="email" required placeholder=" ">
                <label for="email">Email</label>
            </div>

            <!-- Username -->
            <div class="input-group floating">
                <input type="text" id="username" name="username" required placeholder=" ">
                <label for="username">Username</label>
            </div>

            <!-- Password -->
            <div class="input-group floating">
                <input type="password" id="password" name="password" required minlength="8" placeholder=" ">
                <label for="password">Password</label>
            </div>

            <!-- ID Number -->
            <div class="input-group floating">
                <input type="text" id="id_number" name="id_number" required placeholder=" ">
                <label for="id_number">ID Number</label>
            </div>

            <button type="submit" class="register-btn">Register</button>
        </form>

        <p class="login-text">
            Already have an account?
            <a href="{{ url_for('student.login') }}">Login Here</a>
        </p>

    </div>
</div>

</body>
</html>
