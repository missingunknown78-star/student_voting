<!-- Candidate Application Modal -->
<div id="candidateApplicationModal" class="modal" style="display: none;">
    <div class="modal-content" style="max-width: 850px !important; background: var(--modal-bg);">
        <div class="modal-header">
            <h2><i class="fa-solid fa-star" style="color: #9b59b6;"></i> Apply as Candidate</h2>
            <span class="close-modal" onclick="closeCandidateModal()">&times;</span>
        </div>
        <div class="modal-body">
            <!-- Notification container inside modal -->
            <div id="candidateApplicationNotification" class="modal-notification" style="display: none;"></div>
            
            <form id="candidateApplicationForm" enctype="multipart/form-data" style="display: grid; grid-template-columns: 1fr 1fr; column-gap: 30px; row-gap: 20px;">
                <div class="form-group" style="grid-column: 1 / -1;">
                    <label>Your Name</label>
                    <p id="applicantName" style="font-weight: 600; color: var(--text-primary); background: var(--bg-secondary); padding: 12px 15px; border-radius: 10px; border: 2px solid var(--border-color); margin: 0;"></p>
                </div>

                <!-- Party List Field -->
                <div class="form-group">
                    <label>Party List</label>
                    <input type="text" name="party_list" id="apply_party_list" placeholder="Enter party list (e.g., Lakas, Aksyon, etc.)">
                    <small class="form-hint">Optional: Leave blank if independent</small>
                </div>

                <!-- Platform Field -->
                <div class="form-group">
                    <label>Platform</label>
                    <textarea name="platform" id="apply_platform" rows="3" placeholder="Enter your platform, goals, or manifesto" style="min-height: 100px;"></textarea>
                    <small class="form-hint">Tell voters what you stand for</small>
                </div>

                <!-- ELECTION SCOPE -->
                <div class="form-group">
                    <label>Election Scope <span class="required">*</span></label>
                    <select name="scope" id="apply_scope" required onchange="filterElectionsForApply()">
                        <option value="" disabled selected>Select Election Scope</option>
                        <option value="campus">Campus-Wide Election</option>
                        <option value="department">Department Election</option>
                    </select>
                </div>

                <!-- Election Field -->
                <div class="form-group">
                    <label>Election <span class="required">*</span></label>
                    <select name="election_id" id="apply_election" required>
                        <option value="" disabled selected>Select election</option>
                        {% for election in active_elections %}
                            <option value="{{ election.id }}" 
                                    data-scope="{{ election.scope }}"
                                    data-department="{{ election.department_id }}"
                                    style="display: none;">
                                {{ election.title }} ({{ election.scope|title }})
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Position Field -->
                <div class="form-group">
                    <label>Position <span class="required">*</span></label>
                    <select name="position_id" id="apply_position" required>
                        <option value="" disabled selected>Select position</option>
                        {% for position in positions %}
                        <option value="{{ position.id }}">{{ position.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Photo Field -->
                <div class="form-group" style="grid-column: 1 / -1;">
                    <label>Photo (Optional)</label>
                    <input type="file" name="photo" id="apply_photo" accept="image/*">
                    <small class="form-hint">Upload a campaign photo</small>
                </div>

                <div class="form-group" style="grid-column: 1 / -1;">
                    <div class="info-box" style="background: rgba(155, 89, 182, 0.1); border-left: 4px solid #9b59b6; padding: 15px;">
                        <i class="fa-solid fa-info-circle" style="color: #9b59b6;"></i>
                        <span>Your application will be reviewed by the COMELEC admin. You will be notified via email once approved.</span>
                    </div>
                </div>

                <div class="button-group" style="grid-column: 1 / -1; display: flex; justify-content: flex-end; gap: 15px; margin-top: 20px;">
                    <button type="submit" class="bulk-candidate-btn" id="applySubmitBtn" style="background: linear-gradient(135deg, #9b59b6, #8e44ad);">
                        <span class="button-text">Submit Application</span>
                        <span class="loading-spinner" style="display: none;"></span>
                    </button>
                    <button type="button" class="reset-btn" onclick="closeCandidateModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>
</div>

<style>
