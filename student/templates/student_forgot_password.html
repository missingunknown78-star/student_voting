<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
/* Hide scrollbar */
body {
    font-family: Arial, sans-serif;
    background-color: #f5f6fa;
    margin: 0;
    padding: 0;
    overflow: hidden; /* Hide scrollbar */
    height: 100vh;   /* Full viewport height */
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Container centered */
.login-container {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    height: 100%;
    position: fixed; /* Fix it in place */
    top: 0;
    left: 0;
}

.login-box {
    background: #fff;
    padding: 30px;
    border-radius: 8px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    width: 90%;
    max-width: 400px;
    text-align: center;
}

.login-box h2 {
    margin-bottom: 20px;
}

.input-group {
    margin-bottom: 15px;
    text-align: left;
}

.input-group label {
    display: block;
    margin-bottom: 5px;
    font-weight: bold;
}

.input-group input {
    width: 100%;
    padding: 10px;
    border-radius: 5px;
    border: 1px solid #ccc;
    box-sizing: border-box;
}

.login-btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 5px;
    background-color: #3498db;
    color: #fff;
    font-size: 16px;
    cursor: pointer;
}

.login-btn:hover {
    background-color: #2980b9;
}

.alert {
    padding: 10px;
    margin-bottom: 15px;
    border-radius: 5px;
    text-align: left;
}

.alert-success { background-color: #d4edda; color: #155724; }
.alert-danger { background-color: #f8d7da; color: #721c24; }

.register-text {
    margin-top: 15px;
    font-size: 0.9rem;
}
.register-text a {
    color: #3498db;
    text-decoration: none;
}
.register-text a:hover {
    text-decoration: underline;
}

</style>
</head>
<body>

<div class="login-container">
    <div class="login-box">
        <h2>Forgot Password</h2>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="input-group">
                <label for="email">Enter your registered Gmail</label>
                <input type="email" id="email" name="email" placeholder="Enter your Gmail" required>
            </div>
            <div class="input-group">
                <label for="id_number">Enter your Student ID</label>
                <input type="text" id="id_number" name="id_number" placeholder="Enter your Student ID" required>
            </div>
            <button type="submit" class="login-btn">Send Reset Link</button>
        </form>

        <p class="register-text">
            Remembered your password? <a href="{{ url_for('student.login') }}">Login</a>
        </p>
    </div>
</div>

</body>
</html>
