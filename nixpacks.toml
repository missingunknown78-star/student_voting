# nixpacks.toml for Flask + WeasyPrint on Railway

[phases.setup]
# Install Python and all system libs required by WeasyPrint
nixPkgs = [
  "python310",        # Python 3.10
  "pango",            # text rendering
  "cairo",            # PDF rendering
  "gdk-pixbuf",       # image handling
  "libffi",           # required by some Python libs
  "libpng",           # PNG support
  "libjpeg",          # JPEG support
  "zlib",             # compression
  "gobject-introspection",
  "glib"
]

[phases.install]
cmds = [
  "python -m ensurepip",            # ensures pip exists
  "python -m pip install --upgrade pip",  # upgrade pip
  "pip install -r requirements.txt"       # install your Python packages
]

[start]
# Railway expects the web process to listen on $PORT
cmd = "gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120"