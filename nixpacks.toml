# nixpacks.toml for Flask + WeasyPrint on Railway

[phases.setup]
# Install Python + system libraries required by WeasyPrint
nixPkgs = [
  "python310",        # Python 3.10 with pip included
  "pango",            # text layout
  "cairo",            # PDF rendering
  "gdk-pixbuf",       # image processing
  "libffi",           # dependency for some Python packages
  "libpng",           # PNG support
  "libjpeg",          # JPEG support
  "zlib",             # compression
  "gobject-introspection",
  "glib",
  "fontconfig",       # font management
  "freetype"          # fonts
]

[phases.install]
cmds = [
  # Install Python packages using python -m pip to avoid pip not found
  "python -m pip install --no-cache-dir -r requirements.txt"
]

[start]
# Railway expects your web process to listen on $PORT
cmd = "gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120"