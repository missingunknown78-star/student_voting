<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin 2FA Verification</title>
    <style>
        /* ========================================================================== 
           ADMIN 2FA VERIFICATION - STYLE
           ========================================================================== */

        /* --- Reset & Base --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            padding: 20px;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(circle at 10% 20%, rgba(255,255,255,0.1) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(255,255,255,0.05) 0%, transparent 20%);
            z-index: 1;
        }

        /* --- Container --- */
        .login-container {
            width: 380px;
            padding: 35px 30px;
            border-radius: 20px;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 15px 35px rgba(0,0,0,0.25);
            position: relative;
            z-index: 2;
        }

        /* --- Header --- */
        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h2 {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 13px;
            color: rgba(255,255,255,0.85);
            letter-spacing: 1px;
        }

        /* --- Form --- */
        .login-form {
            display: flex;
            flex-direction: column;
        }

        /* ===============================
           FLOATING INPUT SYSTEM
        ================================= */
        .input-group {
            position: relative;
            margin-bottom: 28px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 4px;
            border: none;
            border-bottom: 2px solid rgba(255,255,255,0.4);
            background: transparent;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        /* Label inside input by default */
        .input-group label {
            position: absolute;
            left: 4px;
            top: 14px;
            color: rgba(255,255,255,0.6);
            font-size: 13px;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        /* Float label when input is focused OR has value */
        .input-group input:focus + label,
        .input-group input.filled + label {
            top: -8px;
            font-size: 11px;
            color: #fff;
        }

        /* Input focus underline */
        .input-group input:focus {
            border-bottom: 2px solid #fff;
            box-shadow: 0 2px 0 rgba(255,255,255,0.4);
        }

        /* Autofill fix */
        input:-webkit-autofill {
            -webkit-text-fill-color: #fff !important;
            box-shadow: 0 0 0px 1000px transparent inset !important;
        }

        /* --- Button --- */
        .login-btn {
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            border: none;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 1px;
            color: #fff;
            background: linear-gradient(135deg, #667eea, #764ba2);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.3);
        }

        /* --- Error Message --- */
        .error-msg {
            margin-top: 12px;
            text-align: center;
            color: #ffcccc;
            font-size: 13px;
        }

        /* --- Responsive --- */
        @media (max-width: 480px) {
            .login-container {
                width: 90%;
                padding: 28px 22px;
            }

            .header h2 {
                font-size: 20px;
            }

            .header p {
                font-size: 12px;
            }

            .input-group input {
                padding: 12px 4px;
                font-size: 14px;
            }

            .login-btn {
                padding: 14px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="header">
            <h2>Two-Factor Authentication</h2>
            <p>Enter the 6-digit code from your authenticator app</p>
        </div>

        <form method="POST" class="login-form">
            <div class="input-group">
                <input type="text" name="code" required maxlength="6">
                <label>Authentication Code</label>
            </div>
            

            <button type="submit" class="login-btn">Verify</button>

            {% if error %}
                <p class="error-msg">{{ error }}</p>
            {% endif %}
        </form>
    </div>

    <script>
        // Floating label JS
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('.input-group input');
            inputs.forEach(input => {
                // Float label if input has value on page load
                if(input.value.trim() !== '') input.classList.add('filled');

                // Toggle 'filled' class while typing
                input.addEventListener('input', () => {
                    input.classList.toggle('filled', input.value.trim() !== '');
                });
            });
        });
    </script>
</body>
</html>
