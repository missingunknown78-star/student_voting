<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin 2FA Verification</title>
    
    <!-- CSRF Token Meta Tag - For JavaScript if needed -->
    <meta name="csrf-token" content="{{ csrf_token() }}">
    
    <style>
        /* ========================================================================== 
           ADMIN 2FA VERIFICATION - CLEAN MODERN STYLE (NO PURPLE)
           ========================================================================== */

        /* --- Reset & Base --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            padding: 20px;
            position: relative;
        }

        /* --- Container - Solid White Card --- */
        .login-container {
            width: 420px;
            padding: 40px 35px;
            border-radius: 24px;
            background: #ffffff;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15), 0 5px 15px rgba(0, 0, 0, 0.1);
            position: relative;
            z-index: 2;
            animation: fadeInUp 0.5s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* --- Header --- */
        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .header .icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .header h2 {
            font-size: 28px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .header p {
            font-size: 14px;
            color: #64748b;
            line-height: 1.5;
        }

        /* --- Form --- */
        .login-form {
            display: flex;
            flex-direction: column;
        }

        /* ===============================
           FLOATING INPUT SYSTEM
        ================================= */
        .input-group {
            position: relative;
            margin-bottom: 30px;
        }

        .input-group input {
            width: 100%;
            padding: 16px 12px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            background: #ffffff;
            color: #1e293b;
            font-size: 20px;
            text-align: center;
            letter-spacing: 8px;
            font-weight: 600;
            outline: none;
            transition: all 0.3s ease;
        }

        /* Label styling */
        .input-group label {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 14px;
            font-weight: 500;
            pointer-events: none;
            transition: all 0.3s ease;
            background: #ffffff;
            padding: 0 4px;
        }

        /* Float label when input is focused OR has value */
        .input-group input:focus + label,
        .input-group input.filled + label {
            top: 0;
            transform: translateY(-50%);
            font-size: 12px;
            color: #3b82f6;
        }

        /* Input focus styles */
        .input-group input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        /* Input hover styles */
        .input-group input:hover {
            border-color: #cbd5e1;
        }

        /* Hide placeholder for clean floating effect */
        .input-group input::placeholder {
            color: transparent;
        }

        /* Autofill fix */
        input:-webkit-autofill {
            -webkit-text-fill-color: #1e293b !important;
            background-color: #ffffff !important;
            transition: background-color 5000s ease-in-out 0s;
        }

        /* --- Digits Counter --- */
        .digits-counter {
            text-align: center;
            margin-top: -20px;
            margin-bottom: 20px;
            font-size: 12px;
            color: #64748b;
        }

        .digits-counter span {
            font-weight: bold;
            color: #3b82f6;
            font-size: 14px;
        }

        /* --- Button with Spinner --- */
        .login-btn {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: none;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #fff;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .login-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.3);
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
        }

        .login-btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        /* Button text */
        .btn-text {
            transition: all 0.3s ease;
        }

        /* Spinner styling */
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        /* Spinning state */
        .login-btn.spinning .btn-text {
            display: none;
        }

        .login-btn.spinning .spinner {
            display: inline-block;
        }

        /* Spin animation */
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* --- Messages --- */
        .error-msg {
            margin-top: 20px;
            text-align: center;
            color: #dc2626;
            font-size: 13px;
            padding: 12px;
            border-radius: 10px;
            background: #fef2f2;
            border-left: 3px solid #dc2626;
            animation: shake 0.5s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .success-msg {
            margin-top: 20px;
            text-align: center;
            color: #10b981;
            font-size: 13px;
            background: #f0fdf4;
            padding: 12px;
            border-radius: 10px;
            border-left: 3px solid #10b981;
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .fade-out {
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        /* --- Back Link --- */
        .back-link {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
        }

        .back-link a {
            color: #3b82f6;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s ease;
            padding: 8px 16px;
            border-radius: 8px;
        }

        .back-link a:hover {
            color: #2563eb;
            background: #f8fafc;
            transform: translateX(-3px);
        }

        /* --- Helper Text --- */
        .helper-text {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #94a3b8;
        }

        /* --- Responsive --- */
        @media (max-width: 480px) {
            .login-container {
                width: 95%;
                padding: 30px 25px;
            }

            .header h2 {
                font-size: 24px;
            }

            .header p {
                font-size: 13px;
            }

            .header .icon {
                font-size: 40px;
            }

            .input-group input {
                padding: 14px 10px;
                font-size: 18px;
                letter-spacing: 6px;
            }

            .input-group label {
                font-size: 13px;
            }

            .login-btn {
                padding: 14px;
                font-size: 15px;
            }
            
            .spinner {
                width: 18px;
                height: 18px;
            }
        }

        /* Optional: Add subtle pattern overlay */
        @media (min-width: 768px) {
            body::before {
                content: '';
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: radial-gradient(circle at 20% 50%, rgba(59, 130, 246, 0.05) 0%, transparent 50%);
                pointer-events: none;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="header">
            <h2>Two-Factor Authentication</h2>
            <p>Enter the 6-digit code from your authenticator app to continue</p>
        </div>

        <form method="POST" class="login-form" id="verifyForm">
            <!-- CSRF Token - CRITICAL for security -->
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <div class="input-group">
                <input type="text" 
                       name="code" 
                       id="codeInput"
                       required 
                       maxlength="6" 
                       pattern="[0-9]{6}" 
                       inputmode="numeric"
                       placeholder=" "
                       autocomplete="off">
                <label>Authentication Code</label>
            </div>
            <div class="digits-counter">
                <span id="digitCount">0</span>/6 digits entered
            </div>
            
            <button type="submit" class="login-btn" id="verifyBtn">
                <span class="btn-text">Verify & Continue</span>
                <span class="spinner"></span>
            </button>

            {% if error %}
                <p class="error-msg">{{ error }}</p>
            {% endif %}
            
            {% if success %}
                <div id="successMessage" class="success-msg">{{ success }}</div>
            {% endif %}
        </form>
        
        <!-- Back to Login Link -->
        <div class="back-link">
            <a href="{{ url_for('admin.login') }}">
                ← Back to Login
            </a>
        </div>
        
        <div class="helper-text">
            Use Google Authenticator or any compatible 2FA app
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('.input-group input');
            const verifyForm = document.getElementById('verifyForm');
            const verifyBtn = document.getElementById('verifyBtn');
            const codeInput = document.getElementById('codeInput');
            const digitCountSpan = document.getElementById('digitCount');
            
            // Floating label logic
            inputs.forEach(input => {
                // Float label if input has value on page load
                if(input.value.trim() !== '') input.classList.add('filled');

                // Toggle 'filled' class while typing
                input.addEventListener('input', () => {
                    input.classList.toggle('filled', input.value.trim() !== '');
                });
            });
            
            // Update digit counter
            if (codeInput && digitCountSpan) {
                const updateDigitCount = () => {
                    const length = codeInput.value.length;
                    digitCountSpan.textContent = length;
                    
                    // Add visual feedback when reaching 6 digits
                    if (length === 6) {
                        digitCountSpan.style.color = '#10b981';
                    } else {
                        digitCountSpan.style.color = '#3b82f6';
                    }
                };
                
                codeInput.addEventListener('input', updateDigitCount);
                updateDigitCount(); // Initial call
            }
            
            // Auto-disappear success message after 5 seconds
            const successMsg = document.getElementById('successMessage');
            if (successMsg) {
                setTimeout(() => {
                    successMsg.classList.add('fade-out');
                    setTimeout(() => {
                        successMsg.style.display = 'none';
                    }, 500);
                }, 5000);
            }
            
            // Auto-submit when 6 digits are entered
            if (codeInput) {
                codeInput.addEventListener('input', function() {
                    if (this.value.length === 6 && /^\d{6}$/.test(this.value)) {
                        // Add spinning animation to button
                        verifyBtn.classList.add('spinning');
                        verifyBtn.disabled = true;
                        
                        // Small delay to show the spinner before submitting
                        setTimeout(() => {
                            this.form.submit();
                        }, 300);
                    }
                });
            }
            
            // Add spinning animation on form submit
            verifyForm.addEventListener('submit', function(e) {
                // Only add spinner if not already spinning
                if (!verifyBtn.classList.contains('spinning')) {
                    verifyBtn.classList.add('spinning');
                    verifyBtn.disabled = true;
                }
            });
            
            // Restrict input to numbers only
            if (codeInput) {
                codeInput.addEventListener('keypress', function(e) {
                    const charCode = e.which ? e.which : e.keyCode;
                    if (charCode < 48 || charCode > 57) {
                        e.preventDefault();
                    }
                });
                
                // Handle paste to ensure only numbers
                codeInput.addEventListener('paste', function(e) {
                    e.preventDefault();
                    const pastedText = (e.clipboardData || window.clipboardData).getData('text');
                    const numbersOnly = pastedText.replace(/\D/g, '').slice(0, 6);
                    this.value = numbersOnly;
                    this.classList.toggle('filled', numbersOnly !== '');
                    
                    // Trigger input event to update counter
                    const inputEvent = new Event('input', { bubbles: true });
                    this.dispatchEvent(inputEvent);
                });
            }
        });
    </script>
</body>
</html>
