<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin 2FA Verification</title>
    
    <!-- CSRF Token Meta Tag - For JavaScript if needed -->
    <meta name="csrf-token" content="{{ csrf_token() }}">
    
    <!-- Use existing admin_login.css -->
    <link rel="stylesheet" href="{{ url_for('admin.static', filename='css/admin_login.css') }}">
    
    <style>
        /* Override container size for 2FA verification page */
        .login-container {
            width: 380px !important;
            padding: 35px 30px !important;
        }
        
        /* Header styling matching old structure but with admin_login theme */
        .header {
            text-align: center;
            margin-bottom: 25px;
        }
        
        .header h2 {
            color: #fff;
            font-size: 24px;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
            font-weight: 600;
        }
        
        .header p {
            color: rgba(255, 255, 255, 0.85);
            font-size: 13px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
            line-height: 1.4;
        }
        
        /* Digits counter styling - positioned like old CSS */
        .digits-counter {
            text-align: center;
            font-size: 12px;
            margin-top: -10px;
            margin-bottom: 20px;
            color: rgba(255, 255, 255, 0.7);
        }
        
        #digitCount {
            font-weight: 700 !important;
            font-size: 14px;
            color: #000000 !important;  /* Changed to BLACK */
            background: rgba(255, 255, 255, 0.8);  /* Light background for contrast */
            padding: 2px 8px;
            border-radius: 20px;
            display: inline-block;
            min-width: 28px;
        }
        
        /* Success message styling */
        .success-msg {
            margin-top: 12px;
            text-align: center;
            color: #ccffcc;
            font-size: 13px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
            padding: 10px;
            background: rgba(0, 255, 0, 0.1);
            border-radius: 8px;
            transition: opacity 0.5s ease;
        }
        
        .success-msg.fade-out {
            opacity: 0;
        }
        
        /* Back link styling - matching old structure */
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        
        .back-link a {
            color: rgba(255, 255, 255, 0.75);
            text-decoration: none;
            font-size: 13px;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        
        .back-link a:hover {
            color: #fff;
            text-decoration: underline;
        }
        
        /* Helper text styling - matching old structure */
        .helper-text {
            text-align: center;
            margin-top: 20px;
            padding-top: 15px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
            border-top: 1px solid rgba(255, 255, 255, 0.15);
        }
        
        /* Override input styling for 2FA code */
        .input-group input {
            font-size: 28px;
            font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace;
            letter-spacing: 8px;
            text-align: center;
            font-weight: 500;
        }
        
        /* Error message styling */
        .error-msg {
            margin-top: 12px;
            text-align: center;
            color: #ffcccc;
            font-size: 13px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
            padding: 10px;
            background: rgba(255, 0, 0, 0.1);
            border-radius: 8px;
        }
        
        /* Shake animation for error */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        
        .error-msg {
            animation: shake 0.45s ease;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="header">
            <h2>Two-Factor Authentication</h2>
            <p>Enter the 6-digit code from your authenticator app to continue</p>
        </div>

        <form method="POST" class="login-form" id="verifyForm">
            <!-- CSRF Token - CRITICAL for security -->
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <div class="input-group">
                <input type="text" 
                       name="code" 
                       id="codeInput"
                       required 
                       maxlength="6" 
                       pattern="[0-9]{6}" 
                       inputmode="numeric"
                       placeholder=" "
                       autocomplete="off">
                <label>Authentication Code</label>
            </div>
            <div class="digits-counter">
                <span id="digitCount">0</span>/6 digits entered
            </div>
            
            <button type="submit" class="login-btn" id="verifyBtn">
                <span class="btn-text">Verify & Continue</span>
                <span class="spinner"></span>
            </button>

            {% if error %}
                <p class="error-msg">{{ error }}</p>
            {% endif %}
            
            {% if success %}
                <div id="successMessage" class="success-msg">{{ success }}</div>
            {% endif %}
        </form>
        
        <!-- Back to Login Link -->
        <div class="back-link">
            <a href="{{ url_for('admin.login') }}">
                ← Back to Login
            </a>
        </div>
        
        <div class="helper-text">
            Use Google Authenticator or any compatible 2FA app
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('.input-group input');
            const verifyForm = document.getElementById('verifyForm');
            const verifyBtn = document.getElementById('verifyBtn');
            const codeInput = document.getElementById('codeInput');
            const digitCountSpan = document.getElementById('digitCount');
            
            // Floating label logic
            inputs.forEach(input => {
                // Float label if input has value on page load
                if(input.value.trim() !== '') input.classList.add('filled');

                // Toggle 'filled' class while typing
                input.addEventListener('input', () => {
                    input.classList.toggle('filled', input.value.trim() !== '');
                });
            });
            
            // Update digit counter
            if (codeInput && digitCountSpan) {
                const updateDigitCount = () => {
                    const length = codeInput.value.length;
                    digitCountSpan.textContent = length;
                    
                    // Keep color black always (no color change on 6 digits)
                    digitCountSpan.style.color = '#000000';
                    digitCountSpan.style.background = 'rgba(255, 255, 255, 0.8)';
                };
                
                codeInput.addEventListener('input', updateDigitCount);
                updateDigitCount(); // Initial call
            }
            
            // Auto-disappear success message after 5 seconds
            const successMsg = document.getElementById('successMessage');
            if (successMsg) {
                setTimeout(() => {
                    successMsg.classList.add('fade-out');
                    setTimeout(() => {
                        successMsg.style.display = 'none';
                    }, 500);
                }, 5000);
            }
            
            // Auto-submit when 6 digits are entered
            if (codeInput) {
                codeInput.addEventListener('input', function() {
                    if (this.value.length === 6 && /^\d{6}$/.test(this.value)) {
                        // Add spinning animation to button
                        verifyBtn.classList.add('spinning');
                        verifyBtn.disabled = true;
                        
                        // Small delay to show the spinner before submitting
                        setTimeout(() => {
                            this.form.submit();
                        }, 300);
                    }
                });
            }
            
            // Add spinning animation on form submit
            verifyForm.addEventListener('submit', function(e) {
                // Only add spinner if not already spinning
                if (!verifyBtn.classList.contains('spinning')) {
                    verifyBtn.classList.add('spinning');
                    verifyBtn.disabled = true;
                }
            });
            
            // Restrict input to numbers only
            if (codeInput) {
                codeInput.addEventListener('keypress', function(e) {
                    const charCode = e.which ? e.which : e.keyCode;
                    if (charCode < 48 || charCode > 57) {
                        e.preventDefault();
                    }
                });
                
                // Handle paste to ensure only numbers
                codeInput.addEventListener('paste', function(e) {
                    e.preventDefault();
                    const pastedText = (e.clipboardData || window.clipboardData).getData('text');
                    const numbersOnly = pastedText.replace(/\D/g, '').slice(0, 6);
                    this.value = numbersOnly;
                    this.classList.toggle('filled', numbersOnly !== '');
                    
                    // Trigger input event to update counter
                    const inputEvent = new Event('input', { bubbles: true });
                    this.dispatchEvent(inputEvent);
                });
            }
        });
    </script>
</body>
</html>
