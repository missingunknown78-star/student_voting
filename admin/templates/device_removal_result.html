<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Device Removal - COMELEC Admin</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f4f6fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .card {
            background: white;
            max-width: 450px;
            width: 90%;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
        }
        
        .icon {
            font-size: 60px;
            margin-bottom: 20px;
        }
        
        .success-icon {
            color: #10b981;
        }
        
        .error-icon {
            color: #ef4444;
        }
        
        .info-icon {
            color: #3b82f6;
        }
        
        h1 {
            font-size: 1.8rem;
            margin: 0 0 15px 0;
            color: #1f2937;
        }
        
        p {
            color: #6b7280;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            text-decoration: none;
            padding: 12px 30px;
            border-radius: 40px;
            font-weight: 600;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin: 5px;
            border: none;
            cursor: pointer;
            font-size: 1rem;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
        }
        
        .btn-secondary {
            background: #f3f4f6;
            color: #4b5563;
        }
        
        .btn-secondary:hover {
            background: #e5e7eb;
            box-shadow: none;
            transform: none;
        }
        
        .btn-close {
            background: linear-gradient(135deg, #6b7280, #4b5563);
        }
        
        .btn-close:hover {
            box-shadow: 0 4px 15px rgba(75, 85, 99, 0.3);
        }
        
        .button-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
            justify-content: center;
        }
        
        @media (max-width: 480px) {
            .card {
                padding: 30px 20px;
            }
            
            h1 {
                font-size: 1.5rem;
            }
            
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        {% if success %}
            <div class="icon success-icon">✅</div>
            <h1>Device Removed Successfully!</h1>
            <p>{{ message }}</p>
            <div class="button-container">
                <button onclick="window.close()" class="btn btn-close">Close Window</button>
                <p style="font-size: 0.85rem; color: #9ca3af; margin-top: 10px; margin-bottom: 0;">
                    You may close this window and return to the admin panel.
                </p>
            </div>
        {% else %}
            <div class="icon error-icon">❌</div>
            <h1>Unable to Process</h1>
            <p>{{ message }}</p>
            <div class="button-container">
                <button onclick="window.close()" class="btn btn-close">Close Window</button>
                <p style="font-size: 0.85rem; color: #9ca3af; margin-top: 10px; margin-bottom: 0;">
                    Please close this window and try again from the admin panel.
                </p>
            </div>
        {% endif %}
    </div>
</body>
</html>
