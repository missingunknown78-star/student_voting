<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Device Verification - COMELEC Admin</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f4f6fb;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background: #ffffff;
            padding: 30px 25px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
            text-align: center;
            max-width: 400px;
        }
        .icon {
            font-size: 50px;
            margin-bottom: 15px;
        }
        .success-icon {
            color: #10b981;
        }
        .error-icon {
            color: #ef4444;
        }
        h2 {
            margin: 0 0 12px 0;
            color: #111827;
            font-size: 1.5rem;
        }
        p {
            color: #4b5563;
            font-size: 1rem;
            line-height: 1.5;
        }
        a {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: linear-gradient(135deg, #ff9900, #ff5500);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,85,0,0.3);
            border-radius: 50%;
            border-top-color: #ff5500;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .redirect-message {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #6b7280;
        }
    </style>
</head>
<body>
    <div class="card">
        {% if success %}
        <div class="icon success-icon">✅</div>
        <h2>Success!</h2>
        {% else %}
        <div class="icon error-icon">❌</div>
        <h2>Verification Failed</h2>
        {% endif %}
        
        <p>{{ message }}</p>
        
        {% if auto_redirect %}
        <div class="redirect-message">
            <span class="loading"></span> Redirecting to dashboard...
        </div>
        <script>
            setTimeout(function() {
                window.location.href = "{{ redirect_url }}";
            }, 2000);
        </script>
        {% else %}
        <a href="#" onclick="window.close()">Close Window</a>
        {% endif %}
    </div>
</body>
</html>
