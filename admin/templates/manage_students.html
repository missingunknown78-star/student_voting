{% extends "admin_base.html" %}

{% block title %}Manage Students{% endblock %}

{% block extra_head %}
<link rel="stylesheet" href="{{ url_for('admin.static', filename='css/manage_students.css') }}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
/* ================= FILTER BAR: FORCE ONE LINE ================= */
.filter-bar {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 10px;
    flex-wrap: nowrap;              /* NEVER WRAP */
    overflow-x: auto;               /* Allow scroll if needed */
}

.filter-bar select,
.filter-bar input,
.filter-bar button {
    height: 36px;                   /* Match all heights */
    font-size: 0.9rem;
    white-space: nowrap;
    box-sizing: border-box;
}

/* Fixed widths for predictable layout */
#filterElection { width: 200px; }
#filterType     { width: 170px; }
#filterValue    { width: 180px; }
#searchInput    { width: 200px; }   /* Adjusted to prevent wrapping */
.export-btn     { min-width: 150px; }

/* ---------------- PAGINATION ---------------- */
.pagination {
    margin-top: 20px;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
}
.pagination button {
    padding: 6px 12px;
    border: 1px solid var(--border-color);
    background-color: var(--card-bg);
    cursor: pointer;
    border-radius: 4px;
    font-size: 0.9rem;
    color: var(--text-color);
    transition: all 0.2s ease;
    min-width: 36px;
}
.pagination button:hover:not(:disabled) {
    background-color: var(--primary-blue);
    color: white;
    border-color: var(--primary-blue);
}
.pagination button:disabled {
    background-color: var(--primary-blue);
    color: white;
    border-color: var(--primary-blue);
    cursor: default;
}

/* ---------------- STATUS BADGES ---------------- */
.status-badge {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 4px;
    font-size: 0.8rem;
    font-weight: 600;
    min-width: 80px;
    text-align: center;
}
.status-badge.voted { background-color: #27ae60; color: #fff; }
.status-badge.not-voted { background-color: #c0392b; color: #fff; }

/* ---------------- ACTION BUTTONS ---------------- */
.action-buttons { display: flex; gap: 8px; }
.edit-btn, .delete-btn {
    padding: 6px 12px;
    border: none;
    border-radius: 4px;
    font-size: 0.85rem;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 36px;
    height: 32px;
    transition: all 0.2s ease;
}
.edit-btn { background-color: #2980b9; color: #fff; }
.edit-btn:hover { background-color: #3498db; transform: translateY(-1px); }
.delete-btn { background-color: #c0392b; color: #fff; }
.delete-btn:hover { background-color: #e74c3c; transform: translateY(-1px); }

/* ==================== THEME TRANSITION FIXES ==================== */
/* Force main-content to have transitions */
.main-content {
    transition: background-color 0.3s ease, background-image 0.3s ease !important;
}

/* Ensure the background shows through */
.manage-students-page {
    background: transparent !important;
}

/* Dark mode main content background */
body.dark-mode .main-content,
.main-content.dark-mode {
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%) !important;
}

/* Light mode main content background */
body:not(.dark-mode) .main-content,
.main-content:not(.dark-mode) {
    background: linear-gradient(135deg, #f5f7fb 0%, #e2e8f0 100%) !important;
}

/* Dark mode specific overrides */
body.dark-mode .status-badge.voted {
    background-color: #27ae60;
}

body.dark-mode .status-badge.not-voted {
    background-color: #c0392b;
}

body.dark-mode .edit-btn {
    background-color: #3498db;
}

body.dark-mode .delete-btn {
    background-color: #e74c3c;
}
</style>
{% endblock %}

{% block content %}
<div class="manage-students-page">

    <h1 class="page-title">Manage Students</h1>
    <p class="page-description">View and manage registered students efficiently.</p>

    <!-- ================= FILTER BAR ================= -->
    <div class="filter-bar">

        <select id="filterElection">
            <option value="all">All Elections</option>
            {% for election in elections %}
            <option value="{{ election.id }}">{{ election.title }}</option>
            {% endfor %}
        </select>

        <select id="filterType">
            <option value="all">All Students</option>
            <option value="department">By Department</option>
            <option value="course">By Course</option>
        </select>

        <select id="filterValue" style="display:none"></select>

        <input type="text" id="searchInput" placeholder="Search by ID, name, or course...">

        <button class="export-btn" onclick="exportExcel()">
            <i class="fa-solid fa-file-excel"></i> Export Excel
        </button>

    </div>

    <!-- ================= TABLE ================= -->
    <div class="table-container">
        <table class="students-table">
            <thead>
                <tr>
                    <th>Student ID</th>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Course</th>
                    <th>Year Level</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="studentsBody">
                <!-- AJAX CONTENT -->
            </tbody>
        </table>

        <div class="pagination" id="pagination"></div>
    </div>

</div>

<!-- ================= SAFE JSON DATA ================= -->
<script type="application/json" id="departments-data">{{ departments | tojson }}</script>
<script type="application/json" id="courses-data">{{ courses | tojson }}</script>

<!-- ================= JAVASCRIPT ================= -->
<script>
// === DATA ===
const departments = JSON.parse(document.getElementById("departments-data").textContent);
const courses = JSON.parse(document.getElementById("courses-data").textContent);

let currentPage = 1;
const filterElectionEl = document.getElementById("filterElection");
const filterTypeEl = document.getElementById("filterType");
const filterValueEl = document.getElementById("filterValue");

// === LOAD STUDENTS ===
function loadStudents(page = 1) {
    currentPage = page;
    const search = document.getElementById("searchInput").value;
    const filterType = filterTypeEl.value;
    const filterValue = filterValueEl.value;
    const electionId = filterElectionEl.value;

    let url = `/admin/students/data?page=${page}&search=${encodeURIComponent(search)}`;
    if (electionId && electionId !== "all") url += `&election_id=${electionId}`;
    if (filterType !== "all" && filterValue) url += `&filter_type=${filterType}&filter_id=${filterValue}`;

    fetch(url)
        .then(res => res.json())
        .then(data => {
            const body = document.getElementById("studentsBody");
            const pagination = document.getElementById("pagination");
            body.innerHTML = "";
            pagination.innerHTML = "";

            data.students.forEach(s => {
                const statusClass = s.has_voted ? "voted" : "not-voted";
                const statusText = s.has_voted ? "Voted" : "Not Voted";

                body.innerHTML += `
                <tr>
                    <td>${s.id_number || ""}</td>
                    <td>${s.first_name || ""}</td>
                    <td>${s.last_name || ""}</td>
                    <td>${s.course || ""}</td>
                    <td>${s.year_level || ""}</td>
                    <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                    <td>
                        <div class="action-buttons">
                            <button class="edit-btn"><i class="fa-solid fa-pen"></i></button>
                            <button class="delete-btn"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </td>
                </tr>`;
            });

            for (let i = 1; i <= data.total_pages; i++) {
                pagination.innerHTML += `<button onclick="loadStudents(${i})" ${i === data.current_page ? "disabled" : ""}>${i}</button>`;
            }
            
            // Ensure theme is applied to newly loaded content
            applyThemeToMainContent();
        });
}

// === FILTER LOGIC ===
filterTypeEl.addEventListener("change", () => {
    filterValueEl.innerHTML = "";
    if (filterTypeEl.value === "all") {
        filterValueEl.style.display = "none";
        loadStudents(1);
        return;
    }
    filterValueEl.style.display = "inline-block";
    const data = filterTypeEl.value === "department" ? departments : courses;
    data.forEach(item => filterValueEl.innerHTML += `<option value="${item.id}">${item.name}</option>`);
    loadStudents(1);
});

filterValueEl.addEventListener("change", () => loadStudents(1));
document.getElementById("searchInput").addEventListener("keyup", () => loadStudents(1));
filterElectionEl.addEventListener("change", () => loadStudents(1));

// === EXPORT ===
function exportExcel() {
    const filterType = filterTypeEl.value;
    const filterValue = filterValueEl.value;
    const search = document.getElementById("searchInput").value;
    const electionId = filterElectionEl.value;

    let url = `/admin/students/export-excel?search=${encodeURIComponent(search)}`;
    if (electionId && electionId !== "all") url += `&election_id=${electionId}`;
    if (filterType !== "all" && filterValue) url += `&filter_type=${filterType}&filter_id=${filterValue}`;

    window.location.href = url;
}

// =============== THEME SYNCHRONIZATION FIX ===============
// This ensures the theme applies immediately without refresh
function applyThemeToMainContent() {
    const mainContent = document.querySelector('.main-content');
    if (!mainContent) return;
    
    // Check current theme from localStorage
    const savedTheme = localStorage.getItem('theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const isDark = savedTheme === 'dark' || (!savedTheme && prefersDark);
    
    // Apply or remove dark-mode class
    if (isDark) {
        mainContent.classList.add('dark-mode');
    } else {
        mainContent.classList.remove('dark-mode');
    }
    
    // Ensure content is visible
    mainContent.classList.add('theme-applied');
}

// Apply immediately when page loads
(function() {
    applyThemeToMainContent();
    
    // Also apply after a tiny delay to catch any late initialization
    setTimeout(applyThemeToMainContent, 10);
    setTimeout(applyThemeToMainContent, 50);
    setTimeout(applyThemeToMainContent, 100);
    
    // Listen for theme toggle button clicks
    document.addEventListener('click', function(e) {
        // Check if the clicked element is the theme toggle button or inside it
        if (e.target.closest('#floatingThemeBtn') || e.target.closest('.floating-theme-btn')) {
            // Small delay to let localStorage update
            setTimeout(function() {
                applyThemeToMainContent();
            }, 50);
        }
    });
    
    // Listen for storage events (if theme changed in another tab)
    window.addEventListener('storage', function(e) {
        if (e.key === 'theme') {
            applyThemeToMainContent();
        }
    });
    
    // Create a mutation observer to watch for class changes on body
    const observer = new MutationObserver(function(mutations) {
        mutations.forEach(function(mutation) {
            if (mutation.attributeName === 'class') {
                applyThemeToMainContent();
            }
        });
    });
    
    observer.observe(document.body, { attributes: true });
    
    // Also watch for changes to the main-content class
    const mainContent = document.querySelector('.main-content');
    if (mainContent) {
        const mainContentObserver = new MutationObserver(function(mutations) {
            // Just ensure theme-applied is present
            if (!mainContent.classList.contains('theme-applied')) {
                mainContent.classList.add('theme-applied');
            }
        });
        
        mainContentObserver.observe(mainContent, { attributes: true });
    }
})();

// Handle any future AJAX loads
$(document).ajaxComplete(function() {
    setTimeout(applyThemeToMainContent, 50);
});

// === INIT ===
document.addEventListener("DOMContentLoaded", () => {
    loadStudents();
    applyThemeToMainContent();
});
</script>
{% endblock %}
