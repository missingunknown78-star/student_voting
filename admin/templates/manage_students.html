{% extends "admin_base.html" %}

{% block title %}Manage Students{% endblock %}

{% block extra_head %}
<link rel="stylesheet" href="{{ url_for('admin.static', filename='css/manage_students.css') }}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
/* ================= FILTER BAR: FORCE ONE LINE ================= */
.filter-bar {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 10px;
    flex-wrap: nowrap;              /* NEVER WRAP */
    overflow-x: auto;               /* Allow scroll if needed */
}

.filter-bar select,
.filter-bar input,
.filter-bar button {
    height: 36px;                   /* Match all heights */
    font-size: 0.9rem;
    white-space: nowrap;
    box-sizing: border-box;
}

/* Fixed widths for predictable layout */
#filterElection { width: 200px; }
#filterType     { width: 170px; }
#filterValue    { width: 180px; }
#searchInput    { width: 200px; }   /* Adjusted to prevent wrapping */
.export-btn     { min-width: 150px; }

/* ---------------- PAGINATION ---------------- */
.pagination {
    margin-top: 20px;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
}
.pagination button {
    padding: 6px 12px;
    border: 1px solid #ddd;
    background-color: #f8f9fa;
    cursor: pointer;
    border-radius: 4px;
    font-size: 0.9rem;
    color: #2c3e50;
    transition: all 0.2s ease;
    min-width: 36px;
}
.pagination button:hover:not(:disabled) {
    background-color: #3498db;
    color: white;
    border-color: #3498db;
}
.pagination button:disabled {
    background-color: #3498db;
    color: white;
    border-color: #3498db;
    cursor: default;
}

/* ---------------- STATUS BADGES ---------------- */
.status-badge {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 4px;
    font-size: 0.8rem;
    font-weight: 600;
    min-width: 80px;
    text-align: center;
}
.status-badge.voted { background-color: #27ae60; color: #fff; }
.status-badge.not-voted { background-color: #c0392b; color: #fff; }

/* ---------------- ACTION BUTTONS ---------------- */
.action-buttons { display: flex; gap: 8px; }
.edit-btn, .delete-btn {
    padding: 6px 12px;
    border: none;
    border-radius: 4px;
    font-size: 0.85rem;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 36px;
    height: 32px;
    transition: all 0.2s ease;
}
.edit-btn { background-color: #2980b9; color: #fff; }
.edit-btn:hover { background-color: #3498db; transform: translateY(-1px); }
.delete-btn { background-color: #c0392b; color: #fff; }
.delete-btn:hover { background-color: #e74c3c; transform: translateY(-1px); }
</style>
{% endblock %}

{% block content %}
<div class="manage-students-page">

    <h1 class="page-title">Manage Students</h1>
    <p class="page-description">View and manage registered students efficiently.</p>

    <!-- ================= FILTER BAR ================= -->
    <div class="filter-bar">

        <select id="filterElection">
            <option value="all">All Elections</option>
            {% for election in elections %}
            <option value="{{ election.id }}">{{ election.title }}</option>
            {% endfor %}
        </select>

        <select id="filterType">
            <option value="all">All Students</option>
            <option value="department">By Department</option>
            <option value="course">By Course</option>
        </select>

        <select id="filterValue" style="display:none"></select>

        <input type="text" id="searchInput" placeholder="Search by ID, name, or course...">

        <button class="export-btn" onclick="exportExcel()">
            <i class="fa-solid fa-file-excel"></i> Export Excel
        </button>

    </div>

    <!-- ================= TABLE ================= -->
    <div class="table-container">
        <table class="students-table">
            <thead>
                <tr>
                    <th>Student ID</th>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Course</th>
                    <th>Year Level</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="studentsBody">
                <!-- AJAX CONTENT -->
            </tbody>
        </table>

        <div class="pagination" id="pagination"></div>
    </div>

</div>

<!-- ================= SAFE JSON DATA ================= -->
<script type="application/json" id="departments-data">{{ departments | tojson }}</script>
<script type="application/json" id="courses-data">{{ courses | tojson }}</script>

<!-- ================= JAVASCRIPT ================= -->
<script>
// === DATA ===
const departments = JSON.parse(document.getElementById("departments-data").textContent);
const courses = JSON.parse(document.getElementById("courses-data").textContent);

let currentPage = 1;
const filterElectionEl = document.getElementById("filterElection");
const filterTypeEl = document.getElementById("filterType");
const filterValueEl = document.getElementById("filterValue");

// === LOAD STUDENTS ===
function loadStudents(page = 1) {
    currentPage = page;
    const search = document.getElementById("searchInput").value;
    const filterType = filterTypeEl.value;
    const filterValue = filterValueEl.value;
    const electionId = filterElectionEl.value;

    let url = `/admin/students/data?page=${page}&search=${encodeURIComponent(search)}`;
    if (electionId && electionId !== "all") url += `&election_id=${electionId}`;
    if (filterType !== "all" && filterValue) url += `&filter_type=${filterType}&filter_id=${filterValue}`;

    fetch(url)
        .then(res => res.json())
        .then(data => {
            const body = document.getElementById("studentsBody");
            const pagination = document.getElementById("pagination");
            body.innerHTML = "";
            pagination.innerHTML = "";

            data.students.forEach(s => {
                const statusClass = s.has_voted ? "voted" : "not-voted";
                const statusText = s.has_voted ? "Voted" : "Not Voted";

                body.innerHTML += `
                <tr>
                    <td>${s.id_number || ""}</td>
                    <td>${s.first_name || ""}</td>
                    <td>${s.last_name || ""}</td>
                    <td>${s.course || ""}</td>
                    <td>${s.year_level || ""}</td>
                    <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                    <td>
                        <div class="action-buttons">
                            <button class="edit-btn"><i class="fa-solid fa-pen"></i></button>
                            <button class="delete-btn"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </td>
                </tr>`;
            });

            for (let i = 1; i <= data.total_pages; i++) {
                pagination.innerHTML += `<button onclick="loadStudents(${i})" ${i === data.current_page ? "disabled" : ""}>${i}</button>`;
            }
        });
}

// === FILTER LOGIC ===
filterTypeEl.addEventListener("change", () => {
    filterValueEl.innerHTML = "";
    if (filterTypeEl.value === "all") {
        filterValueEl.style.display = "none";
        loadStudents(1);
        return;
    }
    filterValueEl.style.display = "inline-block";
    const data = filterTypeEl.value === "department" ? departments : courses;
    data.forEach(item => filterValueEl.innerHTML += `<option value="${item.id}">${item.name}</option>`);
    loadStudents(1);
});

filterValueEl.addEventListener("change", () => loadStudents(1));
document.getElementById("searchInput").addEventListener("keyup", () => loadStudents(1));
filterElectionEl.addEventListener("change", () => loadStudents(1));

// === EXPORT ===
function exportExcel() {
    const filterType = filterTypeEl.value;
    const filterValue = filterValueEl.value;
    const search = document.getElementById("searchInput").value;
    const electionId = filterElectionEl.value;

    let url = `/admin/students/export-excel?search=${encodeURIComponent(search)}`;
    if (electionId && electionId !== "all") url += `&election_id=${electionId}`;
    if (filterType !== "all" && filterValue) url += `&filter_type=${filterType}&filter_id=${filterValue}`;

    window.location.href = url;
}

// === INIT ===
document.addEventListener("DOMContentLoaded", () => loadStudents());
</script>
{% endblock %}
