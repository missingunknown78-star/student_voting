{% extends "admin_base.html" %}
{% block title %}Edit Candidate{% endblock %}

{% block extra_head %}
<link rel="stylesheet" href="{{ url_for('admin.static', filename='css/manage_candidates.css') }}">
{% endblock %}

{% block content %}
<div class="container">
    <h1>Edit Candidate</h1>

    <form method="POST">
        <div class="form-group">
            <label for="student_id">Select Student:</label>
            <select name="student_id" id="student_id" required>
                <option value="" disabled>-- Choose Student --</option>
                {% for student in students %}
                <option value="{{ student.id }}" {% if student.id == candidate.student_id %}selected{% endif %}>
                    {{ student.name }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="position_id">Select Position:</label>
            <select name="position_id" id="position_id" required>
                <option value="" disabled>-- Choose Position --</option>
                {% for position in positions %}
                <option value="{{ position.id }}" {% if position.id == candidate.position_id %}selected{% endif %}>
                    {{ position.name }}
                </option>
                {% endfor %}
            </select>
        </div>

        <button type="submit" class="edit-btn">Update Candidate</button>
        <a href="{{ url_for('admin.manage_candidates') }}" class="cancel-btn">Cancel</a>
    </form>
</div>
{% endblock %}
