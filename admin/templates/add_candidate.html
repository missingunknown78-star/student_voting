{% extends "admin_base.html" %}
{% block title %}Add Candidate{% endblock %}

{% block extra_head %}
<link rel="stylesheet" href="{{ url_for('admin.static', filename='css/add_candidate.css') }}">
{% endblock %}

{% block content %}
<div class="container">
    <h1>Add Candidate</h1>

    <form method="POST" enctype="multipart/form-data">
        <!-- First Name -->
        <div class="form-group">
            <label for="first_name">First Name:</label>
            <input type="text" name="first_name" id="first_name" placeholder="Enter first name" required>
        </div>

        <!-- Last Name -->
        <div class="form-group">
            <label for="last_name">Last Name:</label>
            <input type="text" name="last_name" id="last_name" placeholder="Enter last name" required>
        </div>

        <!-- Course -->
        <div class="form-group">
            <label for="course">Course:</label>
            <input type="text" name="course" id="course" placeholder="Enter course" required>
        </div>

        <!-- Position -->
        <div class="form-group">
            <label for="position_id">Select Position:</label>
            <select name="position_id" id="position_id" required>
                <option value="" disabled selected>-- Choose Position --</option>
                {% for position in positions %}
                <option value="{{ position.id }}">{{ position.name }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- Photo -->
        <div class="form-group">
            <label for="photo">Upload Photo:</label>
            <input type="file" name="photo" id="photo" accept="image/*">
        </div>

        <!-- Buttons -->
        <button type="submit" class="add-btn">Add Candidate</button>
        <a href="{{ url_for('admin.manage_candidates') }}" class="cancel-btn">Cancel</a>
    </form>
</div>
{% endblock %}
