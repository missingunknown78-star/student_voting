<!-- Email Change Verification Modal - Exactly like student's -->
<div id="emailChangeModal" class="modal" style="display: none;">
    <div class="modal-content" style="max-width: 400px; text-align: center;">
        <span class="close">&times;</span>
        
        <div class="modal-icon">📧</div>
        <h3>Verify Email Change</h3>
        
        <div id="waitingForConfirmation">
            <p style="font-size: 0.9rem; color: var(--text-secondary);">We sent a verification email to:</p>
            <p style="font-weight: 600; color: var(--text-primary); word-break: break-all; background: var(--bg-tertiary); padding: 12px; border-radius: 6px; font-size: 0.9rem; margin: 10px 0;" id="oldEmailDisplay"></p>
            <p style="font-size: 0.85rem; color: var(--text-secondary);">Please check your email and click <strong>Yes, it's me</strong> to confirm.</p>
            
            <div style="height: 1px; background: var(--border-color); margin: 20px 0;"></div>
            
            <button id="resendEmailBtn" class="btn-secondary" style="width: 100%; padding: 12px; background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border-color); border-radius: 8px; font-weight: 600; font-size: 0.85rem; cursor: pointer;">Resend Verification Email</button>
            
            <div id="timerText" style="font-size: 0.75rem; color: var(--text-muted); margin-top: 10px;"></div>
            
            <a href="#" id="cancelChangeBtn" style="display: block; margin-top: 15px; color: var(--danger-color); text-decoration: none; font-size: 0.85rem;">Cancel</a>
        </div>
        
        <!-- Simple OTP Input -->
        <div id="otpVerification" style="display: none;">
            <p style="font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 10px;">Enter the 6-digit code sent to your new email:</p>
            <input type="text" id="simpleOtpInput" maxlength="6" pattern="\d*" inputmode="numeric" 
                   style="width: 100%; padding: 14px; font-size: 1.2rem; text-align: center; letter-spacing: 4px; border: 2px solid var(--border-color); border-radius: 10px; margin: 15px 0; background: var(--bg-secondary); color: var(--text-primary);">
            <div id="otpError" style="color: var(--danger-color); font-size: 0.8rem; min-height: 20px;"></div>
            
            <div style="display: flex; gap: 12px; margin-top: 10px;">
                <button id="verifyOtpBtn" class="btn-primary" style="flex: 1; padding: 12px; background: var(--primary-gradient); color: white; border: none; border-radius: 8px; font-weight: 600; font-size: 0.85rem; cursor: pointer;">Verify</button>
                <button id="cancelOtpBtn" class="btn-danger" style="flex: 1; padding: 12px; background: var(--danger-color); color: white; border: none; border-radius: 8px; font-weight: 600; font-size: 0.85rem; cursor: pointer;">Cancel</button>
            </div>
        </div>
    </div>
</div>

<style>
/* Modal Styles - Matching student's */
.modal {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0,0,0,0.5);
    align-items: center;
    justify-content: center;
}

.modal-content {
    background: var(--bg-secondary);
    margin: auto;
    padding: 30px;
    border-radius: 18px;
    width: 90%;
    max-width: 400px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    position: relative;
    border: 1px solid var(--border-color);
}

.close {
    position: absolute;
    right: 20px;
    top: 15px;
    font-size: 28px;
    font-weight: bold;
    color: var(--text-muted);
    cursor: pointer;
    transition: color 0.2s;
}

.close:hover {
    color: var(--text-primary);
}

.modal-icon {
    font-size: 48px;
    margin-bottom: 15px;
}

.modal-content h3 {
    color: var(--text-primary);
    margin-bottom: 20px;
    font-size: 1.4rem;
}

.btn-primary, .btn-secondary, .btn-danger {
    transition: all 0.3s ease;
}

.btn-primary:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(255,85,0,0.3);
}

.btn-secondary:hover:not(:disabled) {
    background: var(--border-color);
    transform: translateY(-2px);
}

.btn-danger:hover:not(:disabled) {
    background: #c0392b;
    transform: translateY(-2px);
}

.btn-primary:disabled, .btn-secondary:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

/* Dark mode adjustments */
:root.dark-mode .modal-content {
    background: #2d2d2d;
}

:root.dark-mode .close {
    color: #b0b0b0;
}

:root.dark-mode .close:hover {
    color: #f0f0f0;
}
</style>
