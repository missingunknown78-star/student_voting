<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Admin Panel{% endblock %}</title>
    
    <!-- School Year Meta Tag - Used across all admin pages -->
    <meta name="current-school-year" content="{{ session.get('admin_current_school_year', '') }}">

    <!-- Base Admin CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('admin.static', filename='css/sidebar.css') }}">
    <link rel="stylesheet" href="{{ url_for('admin.static', filename='css/theme.css') }}">
    
    <!-- PREVENT FOUC - CRITICAL: This runs before anything renders -->
    <script>
        (function() {
            // This runs IMMEDIATELY to prevent flash
            try {
                const savedTheme = localStorage.getItem('theme');
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                
                // Apply dark mode class immediately if needed
                if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                    document.documentElement.classList.add('dark-mode');
                    document.documentElement.style.colorScheme = 'dark';
                } else {
                    document.documentElement.classList.remove('dark-mode');
                    document.documentElement.style.colorScheme = 'light';
                }
                
                // Create a small style to hide FOUC
                const style = document.createElement('style');
                style.textContent = `
                    .main-content {
                        visibility: hidden;
                        opacity: 0;
                        transition: opacity 0.2s ease;
                    }
                    .main-content.theme-ready {
                        visibility: visible;
                        opacity: 1;
                    }
                `;
                document.head.appendChild(style);
            } catch (e) {
                console.error('Theme initialization error:', e);
            }
        })();
    </script>

    {% block extra_head %}{% endblock %}
</head>
<body>

<!-- Floating Theme Toggle Button -->
<div class="floating-theme-toggle" id="floatingThemeToggle">
    <button class="floating-theme-btn" id="floatingThemeBtn" title="Toggle Theme">
        <i class="fa-solid fa-sun"></i>
    </button>
</div>

<div class="dashboard-container">
    <!-- ====================== SIDEBAR ====================== -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <img src="{{ url_for('admin.static', filename='images/school_logo.png') }}"
                 alt="School Logo" class="logo">
            <h2>Cebu Technological University</h2>
            <p style="color:#ffcc00; font-size:0.85rem; margin:0;">
                Moalboal Campus
            </p>
        </div>

        <nav class="sidebar-nav">
            <!-- DASHBOARD -->
            <a href="{{ url_for('admin.dashboard') }}"
               class="{% if request.endpoint == 'admin.dashboard' %}active{% endif %}">
               <i class="fa-solid fa-house"></i> Dashboard
            </a>

            <!-- IMPORT STUDENTS -->
            <a href="{{ url_for('admin.import_students') }}"
               class="{% if request.endpoint == 'admin.import_students' %}active{% endif %}">
               <i class="fa-solid fa-file-import"></i> Import Students
            </a>

            <!-- STUDENTS / VOTERS -->
            <a href="{{ url_for('admin.manage_students') }}"
               class="{% if request.endpoint == 'admin.manage_students' %}active{% endif %}">
               <i class="fa-solid fa-users"></i> Manage Students
            </a>

            <!-- CANDIDATES -->
            <a href="{{ url_for('admin.manage_candidates') }}"
               class="{% if request.endpoint == 'admin.manage_candidates' %}active{% endif %}">
               <i class="fa-solid fa-user-check"></i> Manage Candidates
            </a>

            <!-- ELECTIONS -->
            <a href="{{ url_for('admin.create_department_election') }}"
               class="{% if request.endpoint == 'admin.create_department_election' %}active{% endif %}">
               <i class="fa-solid fa-building-columns"></i> Create Elections
            </a>

            <!-- COLLEGES / DEPARTMENTS -->
            <a href="{{ url_for('admin.manage_departments') }}"
               class="{% if request.endpoint == 'admin.manage_departments' %}active{% endif %}">
               <i class="fa-solid fa-building"></i> Colleges
            </a>

            <!-- ANNOUNCEMENTS -->
            <a href="{{ url_for('admin.announcements') }}"
               class="{% if request.endpoint == 'admin.announcements' %}active{% endif %}">
               <i class="fa-solid fa-bullhorn"></i> Announcements
            </a>

            <!-- RESULTS -->
            <a href="{{ url_for('admin.results_page') }}"
               class="{% if request.endpoint in ['admin.results_page', 'admin.election_results'] %}active{% endif %}">
               <i class="fa-solid fa-trophy"></i> Results
            </a>
         
            <!-- LOGOUT -->
            <a href="{{ url_for('admin.logout') }}">
               <i class="fa-solid fa-right-from-bracket"></i> Logout
            </a>
        </nav>
    </aside>
    <!-- ===================================================== -->

    <!-- MAIN CONTENT -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>
</div>

<!-- Single theme management script -->
<script src="{{ url_for('admin.static', filename='js/theme-manager.js') }}"></script>

<!-- School Year Sync Script -->
<script>
    (function() {
        const schoolYearMeta = document.querySelector('meta[name="current-school-year"]');
        window.currentSchoolYear = schoolYearMeta ? schoolYearMeta.content : '';
        
        // Mark main content as ready after a tiny delay
        setTimeout(function() {
            const mainContent = document.querySelector('.main-content');
            if (mainContent) {
                mainContent.classList.add('theme-ready');
            }
        }, 10);
    })();
</script>

</body>
</html>
