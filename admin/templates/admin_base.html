<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Admin Panel{% endblock %}</title>
    
    <!-- School Year Meta Tag - Used across all admin pages -->
    <meta name="current-school-year" content="{{ session.get('admin_current_school_year', '') }}">
    
    <!-- CSRF Token Meta Tag - REMOVED -->

    <!-- Base Admin CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('admin.static', filename='css/sidebar.css') }}">
    <link rel="stylesheet" href="{{ url_for('admin.static', filename='css/theme.css') }}">
    
    <!-- PREVENT FOUC - CRITICAL: This runs before anything renders -->
    <script>
        (function() {
            // This runs IMMEDIATELY to prevent flash
            try {
                const savedTheme = localStorage.getItem('theme');
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                
                // Apply dark mode class immediately if needed
                if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                    document.documentElement.classList.add('dark-mode');
                    document.documentElement.style.colorScheme = 'dark';
                } else {
                    document.documentElement.classList.remove('dark-mode');
                    document.documentElement.style.colorScheme = 'light';
                }
                
                // Create a small style to hide FOUC
                const style = document.createElement('style');
                style.textContent = `
                    .main-content {
                        visibility: hidden;
                        opacity: 0;
                        transition: opacity 0.2s ease;
                    }
                    .main-content.theme-ready {
                        visibility: visible;
                        opacity: 1;
                    }
                `;
                document.head.appendChild(style);
            } catch (e) {
                console.error('Theme initialization error:', e);
            }
        })();
    </script>

    {% block extra_head %}{% endblock %}
</head>
<body>

<!-- Floating Theme Toggle Button -->
<div class="floating-theme-toggle" id="floatingThemeToggle">
    <button class="floating-theme-btn" id="floatingThemeBtn" title="Toggle Theme">
        <i class="fa-solid fa-sun"></i>
    </button>
</div>

<div class="dashboard-container">
    <!-- ====================== SIDEBAR ====================== -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <img src="{{ url_for('admin.static', filename='images/school_logo.png') }}"
                 alt="School Logo" class="logo">
            <h2>Cebu Technological University</h2>
            <p style="color:#ffcc00; font-size:0.85rem; margin:0;">
                Moalboal Campus
            </p>
        </div>

        <nav class="sidebar-nav">
            <!-- DASHBOARD -->
            <a href="{{ url_for('admin.dashboard') }}"
               class="{% if request.endpoint == 'admin.dashboard' %}active{% endif %}">
               <i class="fa-solid fa-house"></i> Dashboard
            </a>

            <!-- IMPORT STUDENTS -->
            <a href="{{ url_for('admin.import_students') }}"
               class="{% if request.endpoint == 'admin.import_students' %}active{% endif %}">
               <i class="fa-solid fa-file-import"></i> Import Students
            </a>

            <!-- ELECTIONS -->
            <a href="{{ url_for('admin.create_department_election') }}"
               class="{% if request.endpoint == 'admin.create_department_election' %}active{% endif %}">
               <i class="fa-solid fa-building-columns"></i> Manage Elections
            </a>

            <!-- STUDENTS / VOTERS -->
            <a href="{{ url_for('admin.manage_students') }}"
               class="{% if request.endpoint == 'admin.manage_students' %}active{% endif %}">
               <i class="fa-solid fa-users"></i> Manage Students
            </a>

            <!-- CANDIDATES -->
            <a href="{{ url_for('admin.manage_candidates') }}"
               class="{% if request.endpoint == 'admin.manage_candidates' %}active{% endif %}">
               <i class="fa-solid fa-user-check"></i> Manage Candidates
            </a>

            <!-- COLLEGES / DEPARTMENTS -->
            <a href="{{ url_for('admin.manage_departments') }}"
               class="{% if request.endpoint == 'admin.manage_departments' %}active{% endif %}">
               <i class="fa-solid fa-building"></i> Colleges
            </a>

            <!-- RESULTS -->
            <a href="{{ url_for('admin.results_page') }}"
               class="{% if request.endpoint in ['admin.results_page', 'admin.election_results'] %}active{% endif %}">
               <i class="fa-solid fa-trophy"></i> Results
            </a>

            <!-- ANNOUNCEMENTS -->
            <a href="{{ url_for('admin.announcements') }}"
               class="{% if request.endpoint == 'admin.announcements' %}active{% endif %}">
               <i class="fa-solid fa-bullhorn"></i> Announcements
            </a>
         
            <!-- LOGOUT -->
            <a href="{{ url_for('admin.logout') }}">
               <i class="fa-solid fa-right-from-bracket"></i> Logout
            </a>
        </nav>
    </aside>
    <!-- ===================================================== -->

    <!-- MAIN CONTENT -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>
</div>

<!-- Single theme management script -->
<script src="{{ url_for('admin.static', filename='js/theme-manager.js') }}"></script>

<!-- Global CSRF Helper Script - REMOVED (CSRF protection disabled) -->
<script>
    (function() {
        // CSRF helper functions removed - CSRF protection disabled
        
        // Auto-add CSRF token to all AJAX forms
        document.addEventListener('DOMContentLoaded', function() {
            // CSRF protection is disabled
            console.log('CSRF protection is disabled');
        });
    })();
</script>

<!-- Sidebar Scroll Position Persistence Script - FIXED -->
<script>
    (function() {
        const schoolYearMeta = document.querySelector('meta[name="current-school-year"]');
        window.currentSchoolYear = schoolYearMeta ? schoolYearMeta.content : '';
        
        // =============== SIDEBAR SCROLL POSITION PERSISTENCE - FIXED ===============
        (function() {
            const SCROLL_POSITION_KEY = 'adminSidebarScrollPosition';
            const sidebar = document.getElementById('sidebar');
            
            if (!sidebar) return;
            
            // Check if we're on dashboard or login page
            const currentPath = window.location.pathname;
            const isDashboard = currentPath.includes('/admin/dashboard');
            const isLoginPage = currentPath.includes('/admin/login');
            
            // Function to scroll active link to the middle of sidebar
            function scrollToActiveLink() {
                const activeLink = document.querySelector('.sidebar-nav a.active');
                if (!activeLink) return false;
                
                // Calculate position to show active link in the middle
                const linkTop = activeLink.offsetTop;
                const linkHeight = activeLink.offsetHeight;
                const sidebarHeight = sidebar.clientHeight;
                
                // Scroll to make active link visible in the middle
                const scrollToPosition = Math.max(0, linkTop - (sidebarHeight / 2) + (linkHeight / 2));
                sidebar.scrollTop = scrollToPosition;
                console.log('Scrolled to active link at position:', scrollToPosition);
                return true;
            }
            
            // Clear saved scroll position (for fresh login)
            function clearSavedScrollPosition() {
                localStorage.removeItem(SCROLL_POSITION_KEY);
                console.log('Cleared saved scroll position');
            }
            
            // Save scroll position before navigating away
            function setupScrollSave() {
                const sidebarLinks = document.querySelectorAll('.sidebar-nav a');
                
                sidebarLinks.forEach(link => {
                    link.addEventListener('click', function(e) {
                        // Don't save position if it's the logout link
                        if (this.getAttribute('href')?.includes('logout')) {
                            clearSavedScrollPosition();
                            return;
                        }
                        
                        // Only save scroll position if NOT on dashboard
                        if (!isDashboard) {
                            const currentScroll = sidebar.scrollTop;
                            localStorage.setItem(SCROLL_POSITION_KEY, currentScroll);
                            console.log('Saved scroll position:', currentScroll);
                        } else {
                            // On dashboard, don't save position (clear it instead)
                            console.log('On dashboard - not saving scroll position');
                        }
                    });
                });
            }
            
            // Restore scroll position or scroll to active link
            function restoreOrScroll() {
                if (!sidebar) return;
                
                // On dashboard or login page, always scroll to active link
                if (isDashboard || isLoginPage) {
                    console.log('Dashboard or login page - scrolling to active link');
                    clearSavedScrollPosition();
                    scrollToActiveLink();
                    return;
                }
                
                // For other pages, restore saved position if it exists
                const savedPosition = localStorage.getItem(SCROLL_POSITION_KEY);
                
                if (savedPosition !== null) {
                    const position = parseInt(savedPosition);
                    
                    // Apply scroll position with multiple attempts to ensure it works
                    const applyScroll = function(attempt) {
                        setTimeout(() => {
                            sidebar.scrollTop = position;
                            console.log(`Applied scroll position (attempt ${attempt}):`, sidebar.scrollTop);
                        }, attempt * 50);
                    };
                    
                    // Try at different intervals
                    applyScroll(1);  // 50ms
                    applyScroll(4);  // 200ms
                    applyScroll(10); // 500ms
                    applyScroll(20); // 1000ms
                } else {
                    // No saved position, scroll to active link
                    scrollToActiveLink();
                }
            }
            
            // Ensure active link is always visible after any dynamic content loads
            function ensureActiveLinkVisible() {
                if (!sidebar) return;
                
                // Small delay to ensure DOM is ready
                setTimeout(() => {
                    const activeLink = document.querySelector('.sidebar-nav a.active');
                    if (!activeLink) return;
                    
                    // Check if active link is visible in viewport
                    const linkTop = activeLink.offsetTop;
                    const linkBottom = linkTop + activeLink.offsetHeight;
                    const sidebarTop = sidebar.scrollTop;
                    const sidebarBottom = sidebarTop + sidebar.clientHeight;
                    
                    // If active link is not fully visible, scroll to it
                    if (linkTop < sidebarTop || linkBottom > sidebarBottom) {
                        console.log('Active link not visible, scrolling to it');
                        const scrollToPosition = Math.max(0, linkTop - (sidebar.clientHeight / 2) + (activeLink.offsetHeight / 2));
                        sidebar.scrollTop = scrollToPosition;
                    }
                }, 100);
            }
            
            // Clear position on logout (redundant but safe)
            function setupLogoutClear() {
                const logoutLink = document.querySelector('.sidebar-nav a[href*="logout"]');
                if (logoutLink) {
                    logoutLink.addEventListener('click', function() {
                        clearSavedScrollPosition();
                        console.log('Cleared scroll position on logout');
                    });
                }
            }
            
            // Initialize
            setupScrollSave();
            setupLogoutClear();
            
            // Restore position or scroll to active based on page
            window.addEventListener('load', function() {
                restoreOrScroll();
                ensureActiveLinkVisible();
            });
            
            // Run after dynamic content might load
            setTimeout(() => {
                if (document.readyState === 'complete') {
                    restoreOrScroll();
                    ensureActiveLinkVisible();
                }
            }, 300);
            setTimeout(() => {
                restoreOrScroll();
                ensureActiveLinkVisible();
            }, 800);
            setTimeout(() => {
                restoreOrScroll();
                ensureActiveLinkVisible();
            }, 1500);
            
        })();
        
        // Mark main content as ready after a tiny delay
        setTimeout(function() {
            const mainContent = document.querySelector('.main-content');
            if (mainContent) {
                mainContent.classList.add('theme-ready');
            }
        }, 10);
    })();
</script>

</body>
</html>
