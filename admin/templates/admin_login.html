<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>

    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('admin.static', filename='css/admin_login.css') }}">
</head>

<body>

<!-- Login Container -->
<div class="login-container" id="loginContainer">
    <!-- Logo + School Name -->
    <div class="header">
        <img src="{{ url_for('admin.static', filename='images/school_logo.png') }}" 
             alt="School Logo" 
             class="school-logo">

        <h2 class="school-name">Cebu Technological University</h2>
        <p class="system-name">CTU-COMELEC</p>
    </div>

    <!-- Login Form -->
    <form action="{{ url_for('admin.login') }}" method="POST" class="login-form" autocomplete="off">

        <h3>Admin Login</h3>

        <!-- Input groups with label AFTER input -->
        <div class="input-group">
            <input 
                type="text" 
                name="username"
                placeholder=" "
                autocomplete="off"
                autocorrect="off"
                autocapitalize="none"
                spellcheck="false"
                required
            >
            <label>Username</label>
        </div>
        
        <div class="input-group">
            <input 
                type="password" 
                name="password"
                placeholder=" "
                autocomplete="new-password"
                required
            >
            <label>Password</label>
        </div>
        
        <button type="submit" class="login-btn">Login</button>

        {% if error %}
            <p class="error-msg">{{ error }}</p>
        {% endif %}

    </form>
</div>

<!-- JS for Floating Labels -->
<script>
document.addEventListener('DOMContentLoaded', () => {
    const inputs = document.querySelectorAll('.input-group input');

    inputs.forEach(input => {
        // Float label on page load if value exists
        if(input.value.trim() !== '') input.classList.add('filled');

        // Toggle 'filled' class when user types
        input.addEventListener('input', () => {
            if(input.value.trim() !== '') {
                input.classList.add('filled');
            } else {
                input.classList.remove('filled');
            }
        });
    });
});
</script>

</body>
</html>
