<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>

    <!-- CSRF Token Meta Tag -->
    <meta name="csrf-token" content="{{ csrf_token() }}">

    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('admin.static', filename='css/admin_login.css') }}">
</head>

<body>

<!-- Login Container -->
<div class="login-container" id="loginContainer">
    <!-- Logo + School Name -->
    <div class="header">
        <img src="{{ url_for('admin.static', filename='images/school_logo.png') }}" 
             alt="School Logo" 
             class="school-logo">

        <h2 class="school-name">Cebu Technological University</h2>
        <p class="system-name">CTU-COMELEC</p>
    </div>

    <!-- Login Form -->
    <form action="{{ url_for('admin.login') }}" method="POST" class="login-form" autocomplete="off" id="loginForm">
        
        <!-- CSRF Token - CRITICAL for security -->
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <h3>Admin Login</h3>

        <!-- Username -->
        <div class="input-group">
            <input 
                type="text" 
                name="username"
                placeholder=" "
                value="{{ request.form.get('username', '') }}"
                autocomplete="off"
                autocorrect="off"
                autocapitalize="none"
                spellcheck="false"
                required
            >
            <label>Username</label>
        </div>
        
        <!-- Password -->
        <div class="input-group">
            <input 
                type="password" 
                name="password"
                placeholder=" "
                autocomplete="new-password"
                required
            >
            <label>Password</label>
        </div>
        
        <!-- Submit Button -->
        <button type="submit" class="login-btn" id="loginBtn">
            <span class="btn-text">Login</span>
            <span class="spinner"></span>
        </button>

        <!-- Error Message -->
        {% if error %}
            <p class="error-msg">{{ error }}</p>
        {% endif %}

    </form>
</div>

<!-- JS for Floating Labels & Button Spinner -->
<script>
document.addEventListener('DOMContentLoaded', () => {
    const inputs = document.querySelectorAll('.input-group input');
    const loginForm = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');

    // Float label on page load if value exists
    inputs.forEach(input => {
        if(input.value.trim() !== '') input.classList.add('filled');

        // Toggle 'filled' class when user types
        input.addEventListener('input', () => {
            if(input.value.trim() !== '') {
                input.classList.add('filled');
            } else {
                input.classList.remove('filled');
            }
        });
    });

    // Add spinning animation on form submit
    loginForm.addEventListener('submit', function(e) {
        // Add spinning class to button
        loginBtn.classList.add('spinning');
        
        // Disable the button to prevent multiple submissions
        loginBtn.disabled = true;
        
        // The form will continue to submit normally
        // If you want to prevent submission for demo, uncomment the next line
        // e.preventDefault();
    });
});
</script>

</body>

</html>
