<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Instructor Registration | CTU Moalboal</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
    box-sizing: border-box;
    font-family: "Segoe UI", Tahoma, sans-serif;
}

body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    display: flex;
    align-items: center;
    justify-content: center;
}

.form-container {
    background: #fff;
    width: 100%;
    max-width: 900px;
    padding: 35px;
    border-radius: 12px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.2);
}

h2 {
    text-align: center;
    margin-bottom: 20px;
    color: #1e3c72;
}

.section-title {
    margin: 25px 0 10px;
    font-size: 18px;
    font-weight: 600;
    color: #2a5298;
    border-bottom: 2px solid #eee;
    padding-bottom: 5px;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.form-group {
    display: flex;
    flex-direction: column;
}

.form-group.full {
    grid-column: span 2;
}

label {
    font-size: 14px;
    margin-bottom: 5px;
    color: #333;
}

input, select {
    padding: 10px;
    border-radius: 6px;
    border: 1px solid #ccc;
    font-size: 14px;
}

input:focus, select:focus {
    outline: none;
    border-color: #2a5298;
}

.submit-btn {
    margin-top: 30px;
    width: 100%;
    padding: 14px;
    background: #2a5298;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

.submit-btn:hover {
    background: #1e3c72;
}

.note {
    text-align: center;
    font-size: 13px;
    margin-top: 15px;
    color: #555;
}
</style>
</head>

<body>

<div class="form-container">
    <h2>Instructor Registration</h2>

    <form>

        <!-- Personal Information -->
        <div class="section-title">Personal Information</div>
        <div class="form-grid">
            <div class="form-group">
                <label>Instructor ID</label>
                <input type="text" placeholder="CTU-INS-2025-001" required>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" placeholder="instructor@ctu.edu.ph" required>
            </div>

            <div class="form-group">
                <label>First Name</label>
                <input type="text" required>
            </div>

            <div class="form-group">
                <label>Last Name</label>
                <input type="text" required>
            </div>

            <div class="form-group">
                <label>Gender</label>
                <select>
                    <option>Male</option>
                    <option>Female</option>
                    <option>Prefer not to say</option>
                </select>
            </div>

            <div class="form-group">
                <label>Mobile Number</label>
                <input type="text" placeholder="09xxxxxxxxx">
            </div>
        </div>

        <!-- Employment Information -->
        <div class="section-title">Employment Information</div>
        <div class="form-grid">
            <div class="form-group">
                <label>Department</label>
                <select>
                    <option>Information Technology</option>
                    <option>Engineering</option>
                    <option>Education</option>
                    <option>Hospitality Management</option>
                </select>
            </div>

            <div class="form-group">
                <label>Program</label>
                <select>
                    <option>BSIT</option>
                    <option>BSCS</option>
                    <option>BSED</option>
                    <option>BSHM</option>
                </select>
            </div>

            <div class="form-group">
                <label>Position</label>
                <select>
                    <option>Instructor I</option>
                    <option>Instructor II</option>
                    <option>Assistant Professor</option>
                    <option>Associate Professor</option>
                </select>
            </div>

            <div class="form-group">
                <label>Employment Type</label>
                <select>
                    <option>Full-Time</option>
                    <option>Part-Time</option>
                </select>
            </div>
        </div>

        <!-- Account Information -->
        <div class="section-title">Account Information</div>
        <div class="form-grid">
            <div class="form-group">
                <label>Username</label>
                <input type="text" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" required>
            </div>

            <div class="form-group full">
                <label>Confirm Password</label>
                <input type="password" required>
            </div>
        </div>

        <!-- Verification -->
        <div class="section-title">Verification</div>
        <div class="form-grid">
            <div class="form-group">
                <label>Upload Faculty ID</label>
                <input type="file">
            </div>

            <div class="form-group">
                <label>Upload Appointment Letter (Optional)</label>
                <input type="file">
            </div>
        </div>

        <button class="submit-btn">Register Instructor</button>

        <div class="note">
            After registration, your account will be reviewed by the Admin before activation.
        </div>

    </form>
</div>

</body>
</html>
