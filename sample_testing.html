<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme Toggle Demo</title>
    <link rel="stylesheet" href="sample_testing.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Theme Toggle Demo</h1>
            <div class="theme-controls">
                <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme">
                    <span class="toggle-icon">🌙</span>
                    <span class="toggle-text">Dark Mode</span>
                </button>
                <div class="theme-status">
                    Current theme: <span id="themeStatus">System</span>
                </div>
            </div>
        </header>

        <main>
            <section class="card">
                <h2>Sample Content</h2>
                <p>This is a demonstration of a theme toggle that respects system preferences while allowing manual override.</p>
                <div class="button-group">
                    <button class="btn primary">Primary Button</button>
                    <button class="btn secondary">Secondary Button</button>
                </div>
            </section>

            <section class="card">
                <h2>Theme Options</h2>
                <div class="theme-options">
                    <button class="theme-option" data-theme="light">☀️ Light</button>
                    <button class="theme-option" data-theme="dark">🌙 Dark</button>
                    <button class="theme-option" data-theme="system">💻 System</button>
                </div>
            </section>
        </main>
    </div>

    <script src="sample_testing.js"></script>
</body>
</html>
