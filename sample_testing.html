<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Students Interface</title>
    <style>
        body { margin: 0; font-family: sans-serif; display: flex; height: 100vh; }
        
        /* Left Sidebar */
        .sidebar { width: 180px; background-color: #4a76c5; display: flex; justify-content: center; align-items: center; border-right: 2px solid #000; }
        .menu-box { background: white; width: 80px; height: 400px; border: 2px solid #000; display: flex; justify-content: center; align-items: center; }
        .menu-text { font-size: 80px; font-weight: bold; transform: rotate(-90deg); white-space: nowrap; }

        /* Main Content */
        .main-content { flex-grow: 1; padding: 20px; display: flex; flex-direction: column; background-color: #fff; }
        .header h1 { margin: 0; font-size: 32px; }
        .header p { margin: 5px 0 20px 0; color: #333; }

        .dashboard-body { display: flex; gap: 20px; flex-grow: 1; }

        /* Filtering Area */
        .filter-section { width: 300px; background-color: #ffcf56; border: 1px solid #4a76c5; padding: 20px; display: flex; flex-direction: column; gap: 15px; height: fit-content; }
        .filter-title { background: white; border: 2px solid #000; padding: 5px; text-align: center; font-weight: bold; }
        
        .filter-row { display: flex; border: 1px solid #000; background: white; height: 35px; align-items: center; }
        .filter-label { width: 40%; font-size: 11px; font-weight: bold; padding-left: 5px; border-right: 1px solid #000; height: 100%; display: flex; align-items: center; }
        .filter-input { width: 60%; background: #4a76c5; color: white; border: none; height: 100%; padding-left: 5px; display: flex; align-items: center; justify-content: space-between; }
        .filter-input::placeholder { color: #ddd; font-size: 12px; }

        .export-btn { background: #00b050; color: white; border: none; padding: 10px; font-weight: bold; cursor: pointer; border: 1px solid #000; margin-top: 10px; }

        /* Student Table Area */
        .table-container { flex-grow: 1; background-color: #4a76c5; padding: 10px; display: flex; flex-direction: column; }
        .grid-columns { display: flex; gap: 5px; flex-grow: 1; }
        .column { flex: 1; display: flex; flex-direction: column; gap: 10px; }
        .col-header { background: white; border: 1px solid #000; padding: 5px; text-align: center; font-size: 11px; font-weight: bold; height: 25px; }
        .col-body { background: #7030a0; flex-grow: 1; border: 1px solid #000; }

        /* Pagination */
        .pagination { display: flex; gap: 10px; align-items: center; margin-top: 10px; }
        .page-num { background: #ccc; border: 2px solid #000; padding: 5px 15px; font-size: 24px; font-weight: bold; }
        .paginate-btn { background: white; border: 2px solid #000; padding: 5px 10px; height: fit-content; cursor: pointer; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="menu-box">
            <div class="menu-text">MENU</div>
        </div>
    </div>

    <div class="main-content">
        <div class="header">
            <h1>Manage Students</h1>
            <p>View and manage registered students efficiently</p>
        </div>

        <div class="dashboard-body">
            <div class="filter-section">
                <div class="filter-title">Filtering Area</div>
                
                <div class="filter-row">
                    <div class="filter-label">SEARCH :</div>
                    <input type="text" class="filter-input" style="background: white; color: black;" placeholder="Name or Student ID">
                </div>

                <div class="filter-row">
                    <div class="filter-label">ELECTION TYPE</div>
                    <div class="filter-input">Available Elections <span style="color:#00b050">▼</span></div>
                </div>

                <div class="filter-row">
                    <div class="filter-label">DEPARTMENT</div>
                    <div class="filter-input">Available Departments <span style="color:#00b050">▼</span></div>
                </div>

                <div class="filter-row">
                    <div class="filter-label">COURSE</div>
                    <div class="filter-input">Available Course <span style="color:#00b050">▼</span></div>
                </div>

                <button class="export-btn">EXPORT EXCEL</button>
            </div>

            <div class="table-container">
                <div class="grid-columns">
                    <div class="column"><div class="col-header">Student ID</div><div class="col-body"></div></div>
                    <div class="column"><div class="col-header">First Name</div><div class="col-body"></div></div>
                    <div class="column"><div class="col-header">Last Name</div><div class="col-body"></div></div>
                    <div class="column"><div class="col-header">Course</div><div class="col-body"></div></div>
                    <div class="column"><div class="col-header">Year Level</div><div class="col-body"></div></div>
                    <div class="column" style="flex: 0.5;"><div class="col-header">Status</div><div class="col-body"></div></div>
                </div>

                <div class="pagination">
                    <div class="page-num">1</div>
                    <button class="paginate-btn">Paginate</button>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
